name: Bug report
description: Something isn't working as expected
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. AirCtl runs entirely on your machine — please do **not** paste secrets, tokens, or private paths you are uncomfortable sharing publicly.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, one-paragraph description of the problem.
      placeholder: "`airctl explain :3000` shows the wrong project for a Vite dev server on Windows."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps we can follow to see the same behavior.
      placeholder: |
        1. Run `npm run dev` in a Vite project on port 5173
        2. Run `airctl explain :5173`
        3. Observe …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include error messages verbatim when possible.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Command output
      description: Paste relevant output. Prefer `--json` when sharing structured data.
      render: shell
      placeholder: |
        airctl explain :3000 --json
        airctl doctor
        airctl version --json

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: v22.14.0
    validations:
      required: true

  - type: input
    id: airctl-version
    attributes:
      label: AirCtl version
      description: Output of `airctl version` or the npm version you installed
      placeholder: 0.1.3
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install AirCtl?
      options:
        - npx
        - npm global
        - From source (git clone)
        - VS Code extension
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions for duplicates
          required: true
        - label: I can reproduce this on the latest release (or main branch)
          required: true
        - label: I removed or redacted sensitive information from the output above
          required: true
