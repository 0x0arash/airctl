pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      glob: "*.{js,ts,tsx,mjs,cjs,json,md,yml,yaml}"
      run: npx oxfmt {staged_files}
      stage_fixed: true
    - name: oxlint
      glob: "*.{js,ts,tsx,mjs,cjs}"
      run: npx oxlint {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}
